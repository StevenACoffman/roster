syntax = "proto3";

package oneroster.v1p2.v1;

import "buf/validate/validate.proto";
import "oneroster/v1p2/v1/academic_session.proto";

option go_package = "github.com/StevenACoffman/roster/gen/go/oneroster/v1p2/v1;onerosterv1p2v1";

message CreateAcademicSessionResponse {
  // The stored session, carrying the date_last_modified to send with the next
  // update.
  AcademicSession academic_session = 1 [(buf.validate.field) = { required: true }];
}
