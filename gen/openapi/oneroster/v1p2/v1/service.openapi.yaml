  /oneroster.v1p2.v1.RosterService/DeleteAcademicSession:
    post:
      tags:
        - oneroster.v1p2.v1.RosterService
      summary: |-
        DeleteAcademicSession marks the session deleted by setting status to
         "tobedeleted". Idempotent.
      description: |-
        Errors: permission_denied without a global roster_admin grant; not_found
         when no such session exists.
      operationId: oneroster.v1p2.v1.RosterService.DeleteAcademicSession
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
