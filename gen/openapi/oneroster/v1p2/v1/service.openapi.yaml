  /oneroster.v1p2.v1.RosterService/DeleteClass:
    post:
      tags:
        - oneroster.v1p2.v1.RosterService
      summary: |-
        DeleteClass marks the class deleted by setting status to "tobedeleted",
         which is what OneRoster defines deletion to mean. The row stops appearing in
         listings but its references survive, so dependent records are not orphaned.
      description: |-
        Idempotent: deleting an already-deleted class succeeds.

         Errors: not_found when the class is not visible to the caller.
      operationId: oneroster.v1p2.v1.RosterService.DeleteClass
      parameters:
        - name: Connect-Protocol-Version
          in: header
