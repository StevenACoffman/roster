openapi: 3.1.0
info:
  title: oneroster.v1p2.v1
  description: API documentation for oneroster.v1p2.v1
  version: 1.0.0
servers:
  - url: https://localhost:8080
    description: Local API Server (TLS)
  - url: http://localhost:8080
    description: Local API Server (Cleartext)
paths:
  /oneroster.v1p2.v1.RosterService/CreateAcademicSession:
    post:
      tags:
        - oneroster.v1p2.v1.RosterService
      summary: CreateAcademicSession stores a new session.
      description: |-
        Errors: invalid_argument when the session fails validation or its dates are
         inverted; already_exists when its sourced_id is taken;
         permission_denied when the caller does not hold a global roster_admin grant.
      operationId: oneroster.v1p2.v1.RosterService.CreateAcademicSession
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/oneroster.v1p2.v1.CreateAcademicSessionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oneroster.v1p2.v1.CreateAcademicSessionResponse'
  /oneroster.v1p2.v1.RosterService/CreateClass:
    post:
      tags:
        - oneroster.v1p2.v1.RosterService
      summary: CreateClass stores a new class.
      description: |-
        Errors: invalid_argument when the class fails validation;
         already_exists when its sourced_id is taken; not_found when the caller holds
         no curating grant over the owning org; failed_precondition when a referenced
         entity does not exist.
      operationId: oneroster.v1p2.v1.RosterService.CreateClass
      parameters:
        - name: Connect-Protocol-Version
