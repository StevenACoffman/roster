StylesPath = .vale/styles
MinAlertLevel = suggestion

; Roster is the only vocabulary this repository defines. It is hand-written and
; tracked; the style packages below are synced and gitignored as disposable —
; see the .vale rules in .gitignore.
Vocab = Roster

Packages = write-good,alex,proselint,https://github.com/StevenACoffman/vale-ai-tells/releases/download/v1.26.0/ai-tells.zip, \
  https://github.com/StevenACoffman/vale-ai-tells/releases/download/v1.26.0/ai-tells-commits.zip

[*.md]
; Only the packages above. Naming a style that Packages does not download makes
; vale silently apply nothing while the config claims otherwise.
BasedOnStyles = alex, proselint, write-good, ai-tells

; ai-tells: repo-local tuning.
;
; These two heuristics over-flag ordinary technical writing about a Go service:
;   FormalRegister        flags implement/implementation/interceptor, which are
;                         the correct terms for what this code does
;   CataphoricForecasting flags back-references such as "Both of these are ..."
;
; Demoted to warning rather than disabled, so an error-gated CI passes on correct
; prose while the hints still surface locally. Narrowing the rules' own token
; lists would be the better fix and belongs upstream.
ai-tells.FormalRegister        = warning
ai-tells.CataphoricForecasting = warning

; write-good's passive-voice check fires on the passive constructions that
; describe what the database does to a request ("a row is never loaded"), where
; the actor genuinely is the database and naming it every time reads worse.
write-good.Passive = warning

[*.sql]
; The schema files carry long explanatory comments and are the one place a reader
; looks to understand the data model, so prose quality is worth checking.
;
; alex is deliberately absent. It reviews language directed at people, and this
; file's flagged tokens are OneRoster column names — sex, asian, white,
; black_or_african_american, hispanic_or_latino_ethnicity — fixed by the
; specification and not renameable. A rule that fires on what cannot be changed
; only teaches people to ignore the tool.
BasedOnStyles = write-good
